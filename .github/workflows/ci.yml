name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - grammar.js
      - src/**
      - test/**
      - queries/**
      - markup/**
      - ucdocs/**
      - bindings/**
      - binding.gyp
      - package.json
      - scripts/**
      - tree-sitter.json
      - .github/workflows/**

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test parser — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
        with:
          # Pin to the same CLI the other jobs use via the npm devDependency
          # (tree-sitter-cli 0.26.9). The default `latest` would float the test
          # matrix onto a different generator than validate/wasm and local dev.
          tree-sitter-ref: v0.26.9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run corpus tests
        run: node scripts/run-tests.js

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated files are up to date
        run: |
          gen_paths='src/ markup/src/ markup/grammar.js markup/queries/ ucdocs/src/'
          node scripts/generate-markup-grammar.js
          node scripts/generate-markup-queries.js
          npx tree-sitter generate
          npx tree-sitter generate markup/grammar.js --output markup/src
          npx tree-sitter generate ucdocs/grammar.js --output ucdocs/src
          # Catch modified tracked files (with a helpful diff)...
          git diff --exit-code $gen_paths
          # ...and NEW untracked artifacts a generator started emitting, which
          # `git diff` ignores — a generator's derived-file set can grow.
          untracked="$(git status --porcelain --untracked-files=all -- $gen_paths)"
          if [ -n "$untracked" ]; then
            echo "Untracked generated files (run the generators and commit them):"
            echo "$untracked"
            exit 1
          fi

      - name: Build parsers
        run: |
          npx tree-sitter build --output ucode.so .
          npx tree-sitter build --output ucode_markup.so markup/

      - name: Checkout ucode language test suite
        uses: actions/checkout@v6
        with:
          repository: jow-/ucode
          path: ucode-lang
          sparse-checkout: tests/custom
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Validate grammar against ucode test corpus
        run: node scripts/validate-corpus.js corpus ucode-lang/tests/custom

      - name: Checkout firewall4
        uses: actions/checkout@v6
        with:
          repository: openwrt/firewall4
          path: firewall4
          fetch-depth: 1

      - name: Validate grammar against firewall4
        run: node scripts/validate-corpus.js project firewall4

  wasm:
    name: Build WASM
    needs: [test, validate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache wasi-sdk
        uses: actions/cache@v5
        with:
          path: ~/.cache/tree-sitter
          key: wasi-sdk-${{ hashFiles('package-lock.json') }}

      - name: Build WASM
        run: |
          npx tree-sitter build --wasm .
          npx tree-sitter build --wasm markup
          npx tree-sitter build --wasm ucdocs

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: "*.wasm"

  prebuild:
    name: Prebuild — ${{ matrix.os }} ${{ matrix.arch }}
    needs: [test, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64   }
          - { os: macos-latest,  arch: arm64 }
          - { os: windows-2022,  arch: x64   }

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install cross-compiler (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build linux-x64
        if: matrix.os == 'ubuntu-latest'
        run: npx prebuildify --napi --strip --arch x64

      - name: Build linux-arm64
        if: matrix.os == 'ubuntu-latest'
        run: |
          npx prebuildify --napi --arch arm64
          aarch64-linux-gnu-strip prebuilds/linux-arm64/*.node
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++

      - name: Build prebuilt binary
        if: matrix.os != 'ubuntu-latest'
        run: npx prebuildify --napi --strip

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds/

  publish:
    name: Publish to npm
    needs: [wasm, prebuild]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # required for npm provenance via OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download WASM
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: .

      - name: Download prebuilds
        uses: actions/download-artifact@v8
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true

      - name: Publish to npm
        run: npm publish --provenance
