name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - common/**
      - ucode/**
      - ucode_markup/**
      - ucdocs/**
      - editors/**
      - bindings/**
      - binding.gyp
      - package.json
      - package-lock.json
      - scripts/**
      - tree-sitter.json
      - CMakeLists.txt
      - Makefile
      - Cargo.toml
      - Cargo.lock
      - go.mod
      - go.sum
      - pyproject.toml
      - setup.py
      - Package.swift
      - .github/workflows/**

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test parser — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2
        with:
          # Pin to the same CLI the other jobs use via the npm devDependency
          # (tree-sitter-cli 0.27.1). The default `latest` would float the test
          # matrix onto a different generator than validate/wasm and local dev.
          tree-sitter-ref: v0.27.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Run corpus tests
        run: node scripts/run-tests.js

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the Node binding
        run: npm run test:bindings

      - name: Verify generated files are up to date
        run: |
          gen_paths='ucode/src/ ucode_markup/src/ ucode_markup/queries/ ucdocs/src/ editors/helix/queries/'
          node scripts/generate-markup-queries.js
          node scripts/generate-helix-queries.js
          npx tree-sitter generate ucode/grammar.js --output ucode/src
          npx tree-sitter generate ucode_markup/grammar.js --output ucode_markup/src
          npx tree-sitter generate ucdocs/grammar.js --output ucdocs/src
          # Catch modified tracked files (with a helpful diff)...
          git diff --exit-code $gen_paths
          # ...and NEW untracked artifacts a generator started emitting, which
          # `git diff` ignores — a generator's derived-file set can grow.
          untracked="$(git status --porcelain --untracked-files=all -- $gen_paths)"
          if [ -n "$untracked" ]; then
            echo "Untracked generated files (run the generators and commit them):"
            echo "$untracked"
            exit 1
          fi

      - name: Build parsers
        run: node scripts/run-tests.js --build-only

      - name: Checkout ucode language test suite
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: jow-/ucode
          # Pinned to the ucode commit shipped by OpenWrt 25.12 (verified via
          # the ucode-2026.01.16~85922056-r1 package on an OpenWrt 25.12.3
          # image — the version string embeds this short hash). This grammar
          # intentionally targets that release, not ucode's unpinned master;
          # see README.md's "Targeted ucode version" section before bumping.
          ref: 85922056ef7abeace3cca3ab28bc1ac2d88e31b1
          path: ucode-lang
          # tests/custom: the language test corpus; the C sources carry the
          # stdlib's JSDoc, the canonical ucdocs corpus.
          sparse-checkout: |
            tests/custom
            /*.c
            /lib/*.c
            /include/ucode/*.h
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Validate grammar against ucode test corpus
        run: node scripts/validate-corpus.js corpus ucode-lang/tests/custom

      - name: Validate ucdocs against ucode's stdlib doc comments
        run: node scripts/validate-docs.js ucode-lang ucode-lang/lib ucode-lang/include/ucode

      - name: Checkout firewall4
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: openwrt/firewall4
          # Pinned so an upstream change cannot turn CI red on its own;
          # bump it deliberately (upstream HEAD of 2026-08-27).
          ref: c2ae8c8940a89407da32fbd662d4010ee2c9bbe6
          path: firewall4
          fetch-depth: 1

      - name: Validate grammar against firewall4
        run: node scripts/validate-corpus.js project firewall4

  bindings:
    name: Bindings — C, Rust, Go, Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: C — build with make
        run: make -j

      - name: C — build with CMake
        run: |
          cmake -S . -B cmake-build
          cmake --build cmake-build -j

      - name: Rust — test
        run: cargo test

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Go — test
        run: go test ./bindings/go/

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # 3.10 is the oldest the cp310-abi3 wheel supports.
          python-version: |
            3.10
            3.12

      - name: Python — build the sdist and a wheel from it, then test the wheel
        run: |
          pip install build
          python -m build --outdir dist .
          for py in python3.10 python3.12; do
            "$py" -m venv "venv-$py"
            "venv-$py/bin/pip" install "$(ls dist/*.whl)[core]"
            "venv-$py/bin/python" -m unittest discover -v -s bindings/python/tests
          done

      # Last, so the runtime checkout cannot leak into the steps above.
      # The oldest supported runtime (ABI 15 needs 0.25), built from source:
      # Ubuntu's libtree-sitter is too old.
      - name: C — check out the tree-sitter 0.25 runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: tree-sitter/tree-sitter
          ref: v0.25.10
          path: tree-sitter-runtime
          fetch-depth: 1

      - name: C — install, link and load
        run: |
          make -C tree-sitter-runtime libtree-sitter.a
          make test-c TS_CFLAGS="-I$PWD/tree-sitter-runtime/lib/include" \
            TS_LIBS="$PWD/tree-sitter-runtime/libtree-sitter.a"

  bindings-swift:
    name: Bindings — Swift
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Swift — test
        run: swift test

  helix:
    name: Helix indents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Helix 25.07.1 and tmux
        run: |
          sudo apt-get update -q
          sudo apt-get install -y tmux
          curl -fsSLo helix.tar.xz https://github.com/helix-editor/helix/releases/download/25.07.1/helix-25.07.1-x86_64-linux.tar.xz
          echo "3f08e63ecd388fff657ad39722f88bb03dcf326f1f2da2700d99e1dc40ab2e8b  helix.tar.xz" | sha256sum -c
          tar -xJf helix.tar.xz -C "$RUNNER_TEMP"

      # Types into a real Helix and checks the new line's indentation.
      - name: Check the Helix indent queries
        run: scripts/check-helix-indents.sh "$RUNNER_TEMP/helix-25.07.1-x86_64-linux"

  neovim:
    name: Neovim indents, folds and text objects
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm

      - name: Build the parsers
        run: |
          npm ci
          node scripts/run-tests.js --build-only

      - name: Install Neovim 0.12.5
        run: |
          curl -fsSLo nvim.tar.gz https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz
          echo "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875  nvim.tar.gz" | sha256sum -c
          tar -xzf nvim.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The plugins that read the queries, at the commits the queries were
      # checked with (both on their main branch).
      - name: Check out nvim-treesitter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: nvim-treesitter/nvim-treesitter
          ref: 910fdf6f49e9dee7e7257c7d11a76b040fdfb9de
          path: nvim/nvim-treesitter

      - name: Check out nvim-treesitter-textobjects
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: nvim-treesitter/nvim-treesitter-textobjects
          ref: 5c7b0263797dfd1bd6202f2b219f3b53a80b2187
          path: nvim/nvim-treesitter-textobjects

      - name: Check the queries in Neovim
        run: |
          nvim --headless --clean -l scripts/check-nvim-queries.lua \
            nvim/nvim-treesitter nvim/nvim-treesitter-textobjects

  wasm:
    name: Build WASM
    needs: [test, validate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache wasi-sdk
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/tree-sitter
          key: wasi-sdk-${{ hashFiles('package-lock.json') }}

      - name: Build WASM
        run: |
          npx tree-sitter build --wasm ucode
          npx tree-sitter build --wasm ucode_markup
          npx tree-sitter build --wasm ucdocs

      - name: Upload WASM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: "*.wasm"

  prebuild:
    name: Prebuild — ${{ matrix.os }} ${{ matrix.arch }}
    needs: [test, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: the aarch64 cross-compiler step is tested on 24.04.
          - { os: ubuntu-24.04,  arch: x64   }
          - { os: macos-latest,  arch: arm64 }
          - { os: macos-15-intel, arch: x64  }
          - { os: windows-2022,  arch: x64   }
          - { os: windows-11-arm, arch: arm64 }

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm

      - name: Install cross-compiler (Linux only)
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build linux-x64
        if: matrix.os == 'ubuntu-24.04'
        run: npx prebuildify --napi --strip --arch x64

      - name: Build linux-arm64
        if: matrix.os == 'ubuntu-24.04'
        run: |
          npx prebuildify --napi --arch arm64
          aarch64-linux-gnu-strip prebuilds/linux-arm64/*.node
        env:
          CC: aarch64-linux-gnu-gcc
          CXX: aarch64-linux-gnu-g++

      - name: Build prebuilt binary
        if: matrix.os != 'ubuntu-24.04'
        run: npx prebuildify --napi --strip

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilds-${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds/

  version:
    name: Tag matches every version string
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Compare the tag with each manifest and lockfile
        run: |
          want="${GITHUB_REF_NAME#v}"
          bad=0
          check() {
            if [ "$2" != "$want" ]; then
              echo "::error file=$1::$1 says version '$2', the tag says $want"
              bad=1
            fi
          }
          check package.json      "$(jq -r .version package.json)"
          check package-lock.json "$(jq -r .version package-lock.json)"
          check package-lock.json "$(jq -r '.packages[""].version' package-lock.json)"
          check tree-sitter.json  "$(jq -r .metadata.version tree-sitter.json)"
          check Cargo.toml        "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          check Cargo.lock        "$(grep -A1 '^name = "tree-sitter-ucode"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          check pyproject.toml    "$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          check CMakeLists.txt    "$(sed -n 's/^ *VERSION "\(.*\)"$/\1/p' CMakeLists.txt)"
          check Makefile          "$(sed -n 's/^VERSION := //p' Makefile)"
          exit $bad

  publish:
    name: Publish to npm
    needs: [version, wasm, prebuild, bindings, bindings-swift, helix, neovim]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # required for npm provenance via OIDC

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download WASM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
          path: .

      - name: Download prebuilds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuilds-*
          path: prebuilds
          merge-multiple: true

      - name: Publish to npm
        run: npm publish --provenance
