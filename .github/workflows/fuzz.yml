name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - common/scanner.h
      - '*/src/scanner.c'
      # A grammar change can reach scanner states no earlier input did.
      - '*/src/parser.c'
  schedule:
    - cron: '17 4 * * 1'   # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.grammar }} scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - grammar: ucode
            directory: ucode
          - grammar: ucode_markup
            directory: ucode_markup
          - grammar: ucdocs
            directory: ucdocs

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fuzz scanner
        uses: tree-sitter/fuzz-action@6a1dcff00aefd038ba418bd63732a9add4901266 # v4
        with:
          directory: ${{ matrix.directory }}
