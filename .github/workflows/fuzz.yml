name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - common/scanner.h
      - '*/src/scanner.c'
      # A grammar change can reach scanner states no earlier input did.
      - '*/src/parser.c'
  schedule:
    - cron: '17 4 * * 1'   # weekly, Monday
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz ${{ matrix.grammar }} scanner
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - grammar: ucode
            directory: ucode
          - grammar: ucode_markup
            directory: ucode_markup
          - grammar: ucdocs
            directory: ucdocs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fuzz scanner
        uses: tree-sitter/fuzz-action@v4
        with:
          directory: ${{ matrix.directory }}
